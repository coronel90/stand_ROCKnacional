<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stand ROCK Nacional</title>

    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.4.0/model-viewer.min.js"></script>

    <style>
      :root {
        --bg: #f1f1f1;
        --card: #ffffff;
        --text: #1a1a1a;
        --muted: #5d5d5d;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
        font-family: Arial, Helvetica, sans-serif;
      }

      .wrap {
        max-width: 1200px;
        margin: 0 auto;
        padding: 20px;
      }

      h1 {
        margin: 0 0 16px;
        text-align: center;
        font-size: clamp(2rem, 4vw, 3rem);
      }

      .card {
        background: var(--card);
        border-radius: 18px;
        overflow: hidden;
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.08);
      }

      model-viewer {
        width: 100%;
        height: 82vh;
        min-height: 480px;
        display: block;
        background: #eeeeee;
      }

      .info {
        padding: 14px 20px 20px;
        color: var(--muted);
        font-size: 0.95rem;
        text-align: center;
      }
    </style>
  </head>

  <body>
    <div class="wrap">
      <h1>Stand ROCK Nacional</h1>

      <div class="card">
        <model-viewer
          src="https://raw.githubusercontent.com/coronel90/stand_ROCKnacional/main/Stand_ROCKnacional.glb"
          alt="Modelo 3D del stand ROCK Nacional"
          ar
          ar-modes="webxr scene-viewer quick-look"
          camera-controls
          auto-rotate
          shadow-intensity="1"
          exposure="1"
          tone-mapping="commerce"
          interaction-prompt="auto"
          loading="eager"
        ></model-viewer>
      </div>

      <div class="info">
        Modelo 3D cargado desde GitHub Pages / raw GitHub.
      </div>
    </div>
  </body>
</html>
