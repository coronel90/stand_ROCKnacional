<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stand ROCK Nacional</title>

    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.4.0/model-viewer.min.js"></script>

    <style>
      :root {
        --text: #fff;
        --muted: #e6e8df;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        color: var(--text);
        font-family: Arial, Helvetica, sans-serif;
        background: #193322;
      }

      .wrap {
        max-width: 1200px;
        margin: 0 auto;
        padding: 20px;
      }

      h1 {
        margin: 0 0 16px;
        text-align: center;
        font-size: clamp(2rem, 4vw, 3rem);
        text-shadow: 0 2px 12px rgba(0, 0, 0, .6);
      }

      .card {
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, .22);
        border-radius: 18px;
        background: #24482f;
        box-shadow: 0 16px 40px rgba(0, 0, 0, .35);
      }

      .festival-scene {
        position: relative;
        isolation: isolate;
        overflow: hidden;
        background:
          radial-gradient(ellipse at 50% 67%, rgba(255, 174, 76, .65), transparent 34%),
          linear-gradient(to bottom, #172b45 0%, #485b67 37%, #9a7652 59%, #315534 60%, #183b27 100%);
      }

      .festival-scene::before {
        content: "";
        position: absolute;
        z-index: -1;
        inset: 0 0 39%;
        background:
          radial-gradient(ellipse at 50% 100%, rgba(255, 190, 83, .55), transparent 45%),
          radial-gradient(ellipse at 28% 100%, rgba(255, 72, 39, .42), transparent 30%),
          radial-gradient(ellipse at 72% 100%, rgba(55, 142, 255, .4), transparent 30%);
      }

      .festival-scene::after {
        content: "";
        position: absolute;
        z-index: -1;
        inset: auto 0 0;
        height: 41%;
        background:
          radial-gradient(ellipse at 8% 35%, #102b1d 0 3%, transparent 3.5%),
          radial-gradient(ellipse at 18% 44%, #102b1d 0 4%, transparent 4.5%),
          radial-gradient(ellipse at 83% 38%, #102b1d 0 4%, transparent 4.5%),
          radial-gradient(ellipse at 94% 48%, #102b1d 0 5%, transparent 5.5%),
          repeating-linear-gradient(105deg, transparent 0 13px, rgba(167, 193, 91, .15) 14px 16px, transparent 17px 30px),
          linear-gradient(to bottom, #456c35, #173b27 72%);
      }

      model-viewer {
        width: 100%;
        height: 82vh;
        min-height: 480px;
        display: block;
        background-color: transparent;
        --poster-color: transparent;
      }

      .info {
        padding: 14px 20px 20px;
        color: var(--muted);
        font-size: .95rem;
        text-align: center;
        background: rgba(15, 34, 23, .86);
      }

      @media (max-width: 600px) {
        .wrap { padding: 12px; }
        model-viewer { min-height: 420px; height: 72vh; }
      }
    </style>
  </head>

  <body>
    <main class="wrap">
      <h1>Stand ROCK Nacional</h1>

      <section class="card" aria-label="Modelo 3D en un festival de rock al aire libre">
        <div class="festival-scene">
          <model-viewer
            src="https://raw.githubusercontent.com/coronel90/stand_ROCKnacional/main/Stand_ROCKnacional.glb"
            alt="Modelo 3D del stand ROCK Nacional"
            ar
            ar-modes="webxr scene-viewer quick-look"
            camera-controls
            camera-orbit="0deg 80deg 55%"
            field-of-view="30deg"
            min-camera-orbit="auto auto 10%"
            max-camera-orbit="auto auto 150%"
            shadow-intensity="1"
            exposure="1"
            tone-mapping="commerce"
            interaction-prompt="auto"
            loading="eager"
          ></model-viewer>
        </div>
        <div class="info">Vista frontal del stand, presentada como escenario principal del festival.</div>
      </section>
    </main>
  </body>
</html>
